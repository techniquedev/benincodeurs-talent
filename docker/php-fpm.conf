[www]
; Les variables d'environnement de Render restent visibles par PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Petit conteneur : peu de processus.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
